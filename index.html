<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캐릭터 숙제 & 장비 관리</title>
<style>
:root{--bg:#fff0f5;--card:#fff;--line:#f3cfdc;--tx:#4a2a38;--mu:#9a6b7f;--ac:#ec7fa3;--ok:#10a37f;--g:#b08a9a;--in:#fff;--ti:#d9578a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Malgun Gothic",sans-serif;font-size:14px}
.w{max-width:1200px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:0;color:var(--ti)}
.top,.bar,.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px}
.bar{justify-content:space-between;margin:12px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:7px 11px;cursor:pointer;font:inherit;font-weight:600}
button.g{background:var(--g)}button.r{background:#b4455a}button.s{padding:3px 8px;font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--line);white-space:nowrap}.tabs button.on{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.av{width:52px;height:52px;border-radius:50%;background:var(--line);object-fit:cover;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
input[type=text],input[type=number],select{background:var(--in);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font:inherit;min-width:0}
.nm{flex:1;font-weight:700;font-size:16px}
.pr{color:var(--ok);font-size:12px;font-weight:700}
.gt{color:var(--ti);font-weight:700;margin:10px 0 4px;font-size:13px}
.it{display:flex;align-items:center;gap:8px;padding:3px 0}.it .l{flex:1}
.bd{font-size:11px;color:var(--mu);border:1px solid var(--line);border-radius:10px;padding:0 6px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
details{border:1px solid var(--line);border-radius:8px;margin:5px 0;padding:5px 8px}summary{cursor:pointer;font-weight:600}summary small{color:var(--mu);font-weight:400}
.gem{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}.gem input{width:100%;margin:2px 0}
.o{display:grid;grid-template-columns:2fr 1fr;gap:4px}
.mo{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px}
.mo>div{background:var(--card);border-radius:12px;padding:14px;width:min(560px,100%)}
.mu{color:var(--mu);font-size:12px}.card{box-shadow:0 2px 8px rgba(0,0,0,.12)}input[type=password]{background:var(--in);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font:inherit}
.sl{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:6px;background:linear-gradient(90deg,hsl(0 80% 70%),hsl(60 80% 70%),hsl(120 80% 70%),hsl(180 80% 70%),hsl(240 80% 70%),hsl(300 80% 70%),hsl(360 80% 70%))}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--ti)}.sl::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--ti)}.sum{margin-top:10px;font-size:12px;line-height:1.6}.sum b{color:var(--ti)}.sum div{border-top:1px dashed var(--line);padding:3px 0}
#th{-webkit-appearance:none;appearance:none;width:130px;height:10px;border-radius:5px;background:linear-gradient(90deg,hsl(0 80% 70%),hsl(60 80% 70%),hsl(120 80% 70%),hsl(180 80% 70%),hsl(240 80% 70%),hsl(300 80% 70%),hsl(360 80% 70%))}
#th::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ti)}#th::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ti)}
</style></head><body><div class="w">
<div class="top"><h1>🎮 캐릭터 숙제 & 장비 관리</h1><div class="hd">
<button data-a="edit" id="eb">✏️ 항목 편집</button><span class="hd">🎨<button class="s g" data-a="pal">색상 설정</button></span><button data-a="cloud">☁ 기기 연동</button><button data-a="exp">💾 백업(내보내기)</button><button data-a="imp">📂 복원(불러오기)</button></div></div>
<div id="app"></div></div><div id="mo"></div>
<input type="file" id="fi" accept=".json" hidden><input type="file" id="fp" accept="image/*" hidden>
<script>
// ---------- 기본 데이터 ----------
const SV=['던컨','데이안','아이라','메이븐','라사','알리사','칼릭스','몰리'];
const GR=['물물교환','재화','일일 콘텐츠','주간 레이드','주간 어비스','주말','기타'];
const PARTS=[['무기',1],['장신구1',3],['장신구2',3],['장신구3',3],['엠블렘',1],['방어구1',3],['방어구2',3],['방어구3',3],['방어구4',3],['방어구5',3]];
const uid=()=>Math.random().toString(36).slice(2,9);
const mk=(g,n,c,k=1)=>({id:uid(),g,n,c,k});
function def(){return{cur:SV[0],items:[mk(1,'은동전','d'),mk(1,'공물','d'),mk(2,'요일 던전','d'),mk(2,'멤버십','d'),mk(2,'아르바이트','d'),
mk(3,'레이드 1','w'),mk(3,'레이드 2','w'),mk(4,'어비스 1','w'),mk(4,'어비스 2','w'),mk(4,'어비스 3','w'),mk(5,'주말 레이드','w'),mk(5,'주말 어비스','w',3)],
chars:Object.fromEntries(SV.map(s=>[s,[]]))}}
let S;const KEY='hw_v1';
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.items)S=def();
// 카테고리(그룹) 목록: 예전 데이터는 새 형식으로 변환
function mig(){if(!S.groups){S.groups=GR.map((n,i)=>({id:'g'+i,n}));S.items.forEach(i=>{if(typeof i.g=='number')i.g='g'+i.g})}}mig();
const save=()=>{S.ts=Date.now();auto();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){ask('저장 공간이 부족해요. 백업을 해주세요.')}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const open=new Set(),gv=new Set();let picC=null,editMode=false,cb=null;
// 확인창(브라우저 기본 팝업은 이 페이지에서 막혀서 직접 만든 팝업 사용)
function ask(msg,fn){cb=fn||null;document.querySelector('#mo').innerHTML=`<div class="mo"><div><p>${esc(msg)}</p><div class="hd"><button class="r" data-a="yes">확인</button><button class="g" data-a="no">취소</button></div></div></div>`}
const $=s=>document.querySelector(s);
const done=c=>{let d=0,t=0;S.items.forEach(i=>{t+=i.k;d+=Math.min(i.k,c.ck?.[i.id]||0)});return[d,t]};

// ---------- 화면 ----------
function render(){
 const cs=S.chars[S.cur]||[];
 $('#app').innerHTML=`<div class="tabs">${SV.map(s=>`<button data-a="sv" data-v="${s}" class="${s==S.cur?'on':''}">${s} (${(S.chars[s]||[]).length})</button>`).join('')}</div>
 <div class="bar"><b>현재 서버: ${S.cur}</b><div class="hd"><button data-a="addc">+ 캐릭터 추가</button>
 <button class="g" data-a="rs" data-m="d">서버 매일 초기화</button><button class="g" data-a="rs" data-m="w">서버 전체 초기화(주간 포함)</button></div></div>
 ${editMode?'<p class="mu">✏️ 항목 편집 중이에요. 이름 수정, 매일/주간 선택, 체크 칸 수, ⧉ 복제, ✕ 삭제, 카테고리 이름·순서(▲▼) 변경, “+ 항목 추가”를 할 수 있어요(모든 캐릭터에 공통 적용). 끝나면 위의 “편집 끝”을 눌러주세요.</p>':''}${cs.length?'':'<p class="mu">아직 캐릭터가 없어요. “+ 캐릭터 추가”를 눌러보세요.</p>'}
 <div class="grid">${cs.map(card).join('')}</div>`;
}
function card(c){
 const[d,t]=done(c);
 return`<div class="card" data-c="${c.id}"><div class="hd">
 <div class="av" data-a="pic" style="${c.img?`background:url(${c.img}) center/cover`:''}">${c.img?'':'👤'}</div>
 <input type="text" class="nm" data-f="name" value="${esc(c.name)}" placeholder="캐릭터 이름">
 <span class="pr">${d}/${t}</span></div>
 <div class="hd" style="margin:8px 0"><button class="s g" data-a="gv">${gv.has(c.id)?'숙제 보기':'장비 보기'}</button>
 <button class="s g" data-a="rc" data-m="d">매일 초기화</button><button class="s g" data-a="rc" data-m="w">전체 초기화</button>
 <button class="s g" data-a="dupc">캐릭터 복제</button><button class="s r" data-a="delc">삭제</button>${c.img?'<button class="s g" data-a="delpic">사진 삭제</button>':''}</div>
 ${gv.has(c.id)?gear(c):hw(c)}</div>`;
}
// 장비 데이터 정리(예전 형식이면 새 형식으로 변환)
function gd(c){c.gear=c.gear||{};PARTS.forEach(([p,n])=>{let g=c.gear[p];
 if(Array.isArray(g))g={rune:(g.find(x=>x.r)||{}).r||'',gems:g.map(x=>({n:x.r||'',o:x.o.map(y=>[y.n,y.v].filter(Boolean).join(' '))}))};
 if(!g||!g.gems)g={rune:'',gems:[]};
 while(g.gems.length<n)g.gems.push({n:'',o:['','','']});c.gear[p]=g})}
function gear(c){gd(c);
 return PARTS.map(([p])=>{const g=c.gear[p];
  return`<details data-p="${p}" ${open.has(c.id+p)?'open':''}><summary>${p} <small>${esc(g.rune)||'룬 미입력'}</small></summary><div class="gem"><input type="text" data-f="rune" data-p="${p}" value="${esc(g.rune)}" placeholder="${p} 룬 이름"></div>`+
  g.gems.map((m,gi)=>`<div class="gem"><input type="text" data-f="gn" data-p="${p}" data-g="${gi}" value="${esc(m.n)}" placeholder="보석 ${gi+1} 이름">`+
  m.o.map((o,oi)=>`<input type="text" data-f="go" data-p="${p}" data-g="${gi}" data-o="${oi}" value="${esc(o)}" placeholder="옵션 ${oi+1}">`).join('')+`</div>`).join('')+`</details>`}).join('')+`<div class="sum">${sum(c)}</div>`;
}
// 룬/보석 한눈에 보기
function sum(c){
 const R=PARTS.map(([p])=>c.gear[p].rune?`${p}: ${esc(c.gear[p].rune)}`:'').filter(Boolean).join(' · ');
 const G=PARTS.map(([p])=>c.gear[p].gems.map((m,i)=>(m.n||m.o.some(Boolean))?`<div>${p}${c.gear[p].gems.length>1?' '+(i+1):''} · <b>${esc(m.n)||'(이름 없음)'}</b> — ${m.o.filter(Boolean).map(esc).join(' / ')}</div>`:'').join('')).join('');
 return`<b>📋 룬 한눈에</b><div>${R||'아직 없어요'}</div><b>💎 보석 한눈에</b>${G||'<div>아직 없어요</div>'}`;
}
function hw(c){
 return S.groups.map(G=>{const gi=G.id,its=S.items.filter(i=>i.g==gi);if(!its.length&&!editMode)return'';
 return`<div class="gt">${editMode?`<span class="hd" data-gid="${gi}"><input type="text" data-f="gname" value="${esc(G.n)}" style="width:140px"><button class="s g" data-a="gup">▲</button><button class="s g" data-a="gdn">▼</button><button class="s r" data-a="gdel">✕</button></span>`:esc(G.n)}</div>`+its.map(i=>{const n=c.ck?.[i.id]||0;
 if(editMode)return`<div class="it" data-i="${i.id}"><input type="text" class="l" data-f="in" value="${esc(i.n)}" style="flex:1"><select data-f="ic"><option value="d" ${i.c=='d'?'selected':''}>매일</option><option value="w" ${i.c=='w'?'selected':''}>주간</option></select><input type="number" min="1" max="9" data-f="ik" value="${i.k}" style="width:46px" title="체크 칸 수"><button class="s g" data-a="dupi" title="복제">⧉</button><button class="s r" data-a="deli">✕</button></div>`;
 return`<div class="it"><span class="l">${esc(i.n)}</span><span class="bd">${i.c=='d'?'매일':'주간'}</span>`+
 Array.from({length:i.k},(_,x)=>`<input type="checkbox" data-a="ck" data-i="${i.id}" data-x="${x}" ${x<n?'checked':''}>`).join('')+`</div>`}).join('')+(editMode?`<button class="s g" data-a="addi" data-g="${gi}">+ 항목 추가</button>`:'')}).join('')+(editMode?'<button class="s" data-a="addg" style="margin-top:10px">+ 카테고리 추가</button>':'');
}
function gearOld(c){
 c.gear=c.gear||{};
 return PARTS.map(([p,n])=>{
  const gs=c.gear[p]=c.gear[p]||Array.from({length:n},()=>({r:'',o:[{n:'',v:''},{n:'',v:''},{n:'',v:''}]}));
  const sm=gs.map(g=>g.r).filter(Boolean).join(', ');
  return`<details data-p="${p}" ${open.has(c.id+p)?'open':''}><summary>${p} <small>${esc(sm)||'미입력'}</small></summary>`+
  gs.map((g,gi)=>`<div class="gem"><input type="text" data-f="rune" data-p="${p}" data-g="${gi}" value="${esc(g.r)}" placeholder="룬 이름 (보석 ${gi+1})">`+
  g.o.map((o,oi)=>`<div class="o"><input type="text" data-f="on" data-p="${p}" data-g="${gi}" data-o="${oi}" value="${esc(o.n)}" placeholder="세공 옵션 ${oi+1}">
  <input type="text" data-f="ov" data-p="${p}" data-g="${gi}" data-o="${oi}" value="${esc(o.v)}" placeholder="수치"></div>`).join('')+`</div>`).join('')+`</details>`}).join('');
}

// ---------- 초기화 ----------
function reset(list,m,label){
 ask(label+' '+(m=='d'?'매일 항목만':'모든 항목(주간 포함)')+' 해제할까요?',()=>{
 list.forEach(c=>S.items.forEach(i=>{if(m=='w'||i.c=='d')delete(c.ck||{})[i.id]}));save();render()});
}

// ---------- 설정창 ----------
function cfg(){
 $('#mo').innerHTML=`<div class="mo"><div><div class="hd" style="justify-content:space-between"><b>공통 항목 설정</b><button data-a="close">닫기</button></div>
 <p class="mu">모든 캐릭터 공통 목록이에요. 이름 수정·주기·횟수 변경·삭제가 가능하고, 기존 체크 기록은 유지돼요.</p>
 ${GR.map((g,gi)=>`<div class="gt">${g}</div>`+S.items.filter(i=>i.g==gi).map(i=>`<div class="it" data-i="${i.id}">
 <input type="text" class="l" data-f="in" value="${esc(i.n)}" style="flex:1">
 <select data-f="ic"><option value="d" ${i.c=='d'?'selected':''}>매일</option><option value="w" ${i.c=='w'?'selected':''}>주간</option></select>
 <input type="number" min="1" max="9" data-f="ik" value="${i.k}" style="width:50px"><button class="s r" data-a="deli">✕</button></div>`).join('')+
 `<button class="s g" data-a="addi" data-g="${gi}">+ 항목 추가</button>`).join('')}</div></div>`;
}

// ---------- 이벤트 ----------
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,cd=b.closest('[data-c]'),c=cd&&S.chars[S.cur].find(x=>x.id==cd.dataset.c);
 if(a=='sv'){S.cur=b.dataset.v;save();render()}
 else if(a=='addc'){S.chars[S.cur].push({id:uid(),name:'새 캐릭터',ck:{}});save();render()}
 else if(a=='dupc'){const n=JSON.parse(JSON.stringify(c));n.id=uid();n.name=c.name+' 복사';n.ck={};const L=S.chars[S.cur];L.splice(L.indexOf(c)+1,0,n);save();render()}
 else if(a=='delc')ask(`“${c.name}” 캐릭터를 삭제할까요?`,()=>{S.chars[S.cur]=S.chars[S.cur].filter(x=>x!=c);save();render()});
 else if(a=='gv'){gv.has(c.id)?gv.delete(c.id):gv.add(c.id);render()}
 else if(a=='ck'){c.ck=c.ck||{};const x=+b.dataset.x,n=c.ck[b.dataset.i]||0;c.ck[b.dataset.i]=b.checked?x+1:x;save();render()}
 else if(a=='rs')reset(S.chars[S.cur],b.dataset.m,'현재 서버 전체 캐릭터의');
 else if(a=='rc')reset([c],b.dataset.m,`“${c.name}”의`);
 else if(a=='pic'){picC=c;$('#fp').click()}
 else if(a=='cloud')cloudUI();
 else if(a=='cup')cloud('up');
 else if(a=='cdn')cloud('down');
 else if(a=='cout'){sset({key:'',auto:false});cloudUI()}
 else if(a=='pal')pal();
 else if(a=='pp'){const p=PRE[+b.dataset.i];Object.assign(S.theme,{h:p[1],b:p[2],d:!!p[3]});theme();save();pal()}
 else if(a=='dk'){S.theme.d=!S.theme.d;theme();save()}
 else if(a=='delpic'){delete c.img;save();render()}
 else if(a=='edit'){editMode=!editMode;$('#eb').textContent=editMode?'✅ 편집 끝':'✏️ 항목 편집';render()}
 else if(a=='yes'){const f=cb;cb=null;$('#mo').innerHTML='';if(f)f()}
 else if(a=='no'){cb=null;$('#mo').innerHTML=''}
 else if(a=='close'){$('#mo').innerHTML='';render()}
 else if(a=='addi'){{const g=b.dataset.g,l=S.items.filter(i=>i.g==g).pop();S.items.push(mk(g,'새 항목',l?l.c:'d',l?l.k:1))}save();render()}
 else if(a=='gup'||a=='gdn'){const id=b.closest('[data-gid]').dataset.gid,L=S.groups,x=L.findIndex(g=>g.id==id),y=x+(a=='gup'?-1:1);if(y>=0&&y<L.length){[L[x],L[y]]=[L[y],L[x]];save();render()}}
 else if(a=='gdel'){const id=b.closest('[data-gid]').dataset.gid;ask('이 카테고리와 안의 항목을 모두 삭제할까요? (체크 기록도 사라져요)',()=>{S.groups=S.groups.filter(g=>g.id!=id);S.items=S.items.filter(i=>i.g!=id);save();render()})}
 else if(a=='addg'){S.groups.push({id:uid(),n:'새 카테고리'});save();render()}
 else if(a=='dupi'){const id=b.closest('[data-i]').dataset.i,x=S.items.findIndex(i=>i.id==id);S.items.splice(x+1,0,{...S.items[x],id:uid()});save();render()}
 else if(a=='deli'){const id=b.closest('[data-i]').dataset.i;ask('이 항목을 삭제할까요? (체크 기록도 사라져요)',()=>{S.items=S.items.filter(i=>i.id!=id);save();render()})}
 else if(a=='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='숙제백업.json';l.click()}
 else if(a=='imp')$('#fi').click();
});
document.addEventListener('toggle',e=>{const d=e.target,cd=d.closest&&d.closest('[data-c]');if(d.tagName!='DETAILS'||!cd)return;
 const k=cd.dataset.c+d.dataset.p;d.open?open.add(k):open.delete(k)},true);
document.addEventListener('input',e=>{
 const t=e.target,f=t.dataset.f;if(!f)return;
 const cd=t.closest('[data-c]'),c=cd&&S.chars[S.cur].find(x=>x.id==cd.dataset.c);
 if(f=='name')c.name=t.value;
 else if(f=='rune'){c.gear[t.dataset.p].rune=t.value;t.closest('details').querySelector('small').textContent=t.value||'룬 미입력'}
 else if(f=='gname')S.groups.find(g=>g.id==t.closest('[data-gid]').dataset.gid).n=t.value;
 else if(f=='gn')c.gear[t.dataset.p].gems[t.dataset.g].n=t.value;
 else if(f=='go')c.gear[t.dataset.p].gems[t.dataset.g].o[t.dataset.o]=t.value;
 else{const i=S.items.find(x=>x.id==t.closest('[data-i]').dataset.i);
  if(f=='in')i.n=t.value;else if(f=='ic')i.c=t.value;else if(f=='ik')i.k=Math.max(1,Math.min(9,+t.value||1))}
 save();
});
// 사진 업로드: 작게 줄여서 저장
$('#fp').onchange=e=>{const f=e.target.files[0];if(!f||!picC)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const z=96,cv=document.createElement('canvas');cv.width=cv.height=z;
  const m=Math.min(im.width,im.height);cv.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);
  picC.img=cv.toDataURL('image/jpeg',.8);save();render()};im.src=r.result};r.readAsDataURL(f);e.target.value=''};
// 복원
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.items||!d.chars)throw 0;ask('현재 기록을 백업 파일로 덮어쓸까요?',()=>{S=d;mig();theme();save();render()});}catch(x){ask('올바른 백업 파일이 아니에요.')}};
 r.readAsText(f);e.target.value=''};
// 색상 테마: 색상 슬라이더(0~360) + 밝게/어둡게
// 색상 조합(이름, 포인트색, 배경색, 어둡게여부)
const PRE=[['연분홍',340,340,0],['라벤더',265,270,0],['민트',165,160,0],['하늘',205,205,0],['살구',22,30,0],['레몬',46,50,0],['밤분홍',335,330,1],['밤보라',270,260,1],['심해',195,215,1],['숲',150,150,1]];
function theme(){const t=S.theme||(S.theme={h:335,d:false});if(t.b==null)t.b=t.h;const h=t.h,b=t.b,d=t.d,r=document.documentElement.style;
 const P=d?{bg:`hsl(${b} 14% 8%)`,card:`hsl(${b} 12% 13%)`,line:`hsl(${b} 10% 24%)`,tx:`hsl(${b} 15% 92%)`,mu:`hsl(${b} 8% 62%)`,ac:`hsl(${h} 70% 62%)`,g:`hsl(${b} 8% 34%)`,in:`hsl(${b} 14% 7%)`,ti:`hsl(${h} 85% 72%)`}
 :{bg:`hsl(${b} 85% 96%)`,card:`hsl(${b} 60% 99%)`,line:`hsl(${b} 45% 88%)`,tx:`hsl(${b} 25% 18%)`,mu:`hsl(${b} 12% 42%)`,ac:`hsl(${h} 70% 62%)`,g:`hsl(${b} 14% 58%)`,in:'#fff',ti:`hsl(${h} 60% 48%)`};
 for(const k in P)r.setProperty('--'+k,P[k]);r.colorScheme=d?'dark':'light';
 const k=document.getElementById('dk');if(k)k.textContent=d?'☀ 밝게':'☾ 어둡게'}
// ---------- 기기 연동(Firebase Realtime Database REST) ----------
const DBURL=''; // 여기에 데이터베이스 주소를 적어두면 매번 입력 안 해도 됨(선택)
const SK='hw_sync';
function sget(){try{return JSON.parse(localStorage.getItem(SK))||{}}catch(e){return{}}}
function sset(o){try{localStorage.setItem(SK,JSON.stringify(Object.assign(sget(),o)))}catch(e){}}
// 아이디+비밀번호를 해시로 바꿔 저장 위치 이름으로 사용(비밀번호 자체는 저장 안 함)
async function hk(id,pw){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('hw|'+id.toLowerCase()+'|'+pw));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function msg(t){const e=$('#cm');if(e)e.textContent=t}
let at=null;
function auto(){const f=sget();if(!f.key||!f.url||!f.auto)return;clearTimeout(at);at=setTimeout(()=>{fetch(f.url+'/u/'+f.key+'.json',{method:'PUT',body:JSON.stringify(S)}).catch(()=>{})},2500)}
// 열 때/다시 보일 때 클라우드가 더 최신이면 가져오기
async function pull(){const f=sget();if(!f.key||!f.auto)return;try{const r=await fetch(f.url+'/u/'+f.key+'.json');const d=r.ok&&await r.json();if(d&&d.items&&(d.ts||0)>(S.ts||0)){S=d;mig();theme();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}}catch(e){}}
async function cloud(mode){
 const url=$('#curl').value.trim().replace(/\/+$/,''),id=$('#cid').value.trim(),pw=$('#cpw').value;
 if(!url||!id||!pw)return msg('주소, 아이디, 비밀번호를 모두 입력해 주세요.');
 try{const k=await hk(id,pw),u=url+'/u/'+k+'.json';
  if(mode=='up'){const r=await fetch(u,{method:'PUT',body:JSON.stringify(S)});if(!r.ok)throw 0;sset({url,id,key:k,auto:true});cloudUI();msg('☁ 올렸어요! 다른 기기에서 같은 아이디/비밀번호로 “불러오기”를 누르세요.')}
  else{const r=await fetch(u);if(!r.ok)throw 0;const d=await r.json();
   if(!d||!d.items)return msg('이 아이디/비밀번호로 저장된 기록이 없어요. 아이디·비밀번호를 확인하거나 다른 기기에서 먼저 “올리기”를 해 주세요.');
   sset({url,id});ask('이 기기의 기록을 클라우드 기록으로 덮어쓸까요?',()=>{S=d;mig();theme();sset({key:k,auto:true});save();render()})}
 }catch(e){msg('연결에 실패했어요. 주소가 맞는지, Rules를 Publish 했는지 확인해 주세요.')}
}
function cloudUI(){const f=sget();$('#mo').innerHTML=`<div class="mo"><div><div class="hd" style="justify-content:space-between"><b>☁ 기기 연동</b><button data-a="close">닫기</button></div>
 <p class="mu">같은 아이디·비밀번호를 쓰면 폰과 컴퓨터의 기록이 같아져요. 비밀번호를 잊으면 복구할 수 없어요.</p>
 <p class="mu">데이터베이스 주소 (Firebase)</p><input type="text" id="curl" value="${esc(f.url||DBURL)}" placeholder="https://....firebasedatabase.app" style="width:100%">
 <p class="mu">아이디</p><input type="text" id="cid" value="${esc(f.id||'')}" style="width:100%">
 <p class="mu">비밀번호</p><input type="password" id="cpw" style="width:100%">
 <div class="hd" style="margin-top:10px"><button data-a="cup">☁ 올리기(저장)</button><button class="g" data-a="cdn">⬇ 불러오기</button>${f.key?'<button class="s r" data-a="cout">연동 끄기</button>':''}</div>
 <p class="mu" id="cm">${f.key?'✅ 연동 중이에요. 이 기기에서 바꾸면 자동으로 클라우드에 올라가고, 열 때 최신 기록을 가져와요.':'처음에는 한쪽 기기에서 “올리기”, 다른 기기에서 “불러오기”를 눌러요.'}</p></div></div>`}
// 색상 설정창
function pal(){const t=S.theme;$('#mo').innerHTML=`<div class="mo"><div><div class="hd" style="justify-content:space-between"><b>🎨 색상 설정</b><button data-a="close">닫기</button></div>
 <p class="mu">추천 조합</p><div class="hd">${PRE.map((p,i)=>`<button class="s" data-a="pp" data-i="${i}" style="background:hsl(${p[1]} 70% 62%);border:3px solid ${p[3]?`hsl(${p[2]} 14% 16%)`:`hsl(${p[2]} 85% 92%)`}">${p[0]}</button>`).join('')}</div>
 <p class="mu">포인트 색 (버튼·제목)</p><input type="range" class="sl" id="sh" min="0" max="360" value="${t.h}">
 <p class="mu">배경 색</p><input type="range" class="sl" id="sb" min="0" max="360" value="${t.b}">
 <p><button class="g" data-a="dk" id="dk">${t.d?'☀ 밝게':'☾ 어둡게'}</button></p></div></div>`}
function themeOld(){const t=S.theme||(S.theme={h:335,d:false}),h=t.h,d=t.d,r=document.documentElement.style;
 const P=d?{bg:`hsl(${h} 25% 9%)`,card:`hsl(${h} 22% 14%)`,line:`hsl(${h} 18% 26%)`,tx:`hsl(${h} 25% 93%)`,mu:`hsl(${h} 12% 65%)`,ac:`hsl(${h} 55% 55%)`,g:`hsl(${h} 12% 38%)`,in:`hsl(${h} 25% 8%)`,ti:`hsl(${h} 80% 76%)`}
 :{bg:`hsl(${h} 90% 96%)`,card:`hsl(${h} 100% 99%)`,line:`hsl(${h} 60% 87%)`,tx:`hsl(${h} 30% 20%)`,mu:`hsl(${h} 15% 45%)`,ac:`hsl(${h} 70% 62%)`,g:`hsl(${h} 18% 60%)`,in:'#fff',ti:`hsl(${h} 60% 50%)`};
 for(const k in P)r.setProperty('--'+k,P[k]);r.colorScheme=d?'dark':'light';
 $('#th').value=h;$('#dk').textContent=d?'☀ 밝게':'☾ 어둡게'}
document.addEventListener('input',e=>{const t=e.target;if(t.id=='sh'||t.id=='sb'){S.theme[t.id=='sh'?'h':'b']=+t.value;theme();save()}});
// 룬/보석 한눈에 보기 실시간 갱신
document.addEventListener('input',e=>{const t=e.target,cd=t.closest('[data-c]'),s=cd&&cd.querySelector('.sum');
 if(s&&/^(rune|gn|go)$/.test(t.dataset.f))s.innerHTML=sum(S.chars[S.cur].find(x=>x.id==cd.dataset.c))});
theme();render();pull();document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script></body></html>
